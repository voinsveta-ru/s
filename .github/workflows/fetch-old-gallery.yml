# Служебный workflow: скачивает фото со CDN старого сайта и коммитит
# их в ветку photos/old-site. Запускается автоматически по push изменений
# этого файла или списка ссылок (защита от цикла через paths-фильтр).
name: Fetch old gallery photos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-old-gallery.yml"
      - "scripts/old-gallery-urls.txt"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download photos from old site CDN
        run: |
          mkdir -p old-photos
          BASE="https://274418.selcdn.ru/cv08300-33250f0d-0664-43fc-9dbf-9d89738d114e/uploads/690152"
          ok=0; fail=0
          while read -r name; do
            [ -z "$name" ] && continue
            code=$(curl -s -o "old-photos/$name.jpg" -w "%{http_code}" -m 40 "$BASE/$name.jpg" || echo err)
            size=$(stat -c%s "old-photos/$name.jpg" 2>/dev/null || echo 0)
            echo "$name -> $code (${size}b)"
            if [ "$code" = "200" ] && [ "$size" -gt 10000 ]; then
              ok=$((ok+1))
            else
              fail=$((fail+1)); rm -f "old-photos/$name.jpg"
            fi
          done < scripts/old-gallery-urls.txt
          echo "OK: $ok, FAIL: $fail" | tee old-photos/_report.txt
          ls old-photos | head -60

      - name: Commit photos to photos/old-site branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Ветку продолжаем, а не пересоздаём от main: иначе повторный push
          # отклонялся бы как non-fast-forward и фото не обновлялись.
          if git ls-remote --exit-code --heads origin photos/old-site; then
            git fetch --depth=1 origin photos/old-site
            git checkout -B photos/old-site FETCH_HEAD
          else
            git checkout -B photos/old-site
          fi
          git add old-photos
          if git diff --cached --quiet; then
            echo "Нечего коммитить"
          else
            git commit -m "Фото со CDN старого сайта (автоперенос)"
            git push origin photos/old-site
          fi
