name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # Деплой не отменяем на середине: иначе Pages могут остаться без артефакта
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # v7+ — рантайм Node 24 (Node 20 в Actions deprecated с 2026-06)
      - name: Checkout
        uses: actions/checkout@v7

      # Pages должны быть включены руками ОДИН раз (Settings → Pages →
      # Source: GitHub Actions). Создать сайт через API может только токен
      # с Administration:write, а GITHUB_TOKEN такой доступ выдать нельзя —
      # поэтому configure-pages с enablement:true на «свежем» репозитории
      # падает с невнятным «Resource not accessible by integration».
      # Проверяем заранее и говорим, что нажать.
      - name: Проверка, что GitHub Pages включены
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.status' > /dev/null 2>&1; then
            echo "GitHub Pages: включены"
          else
            echo "::error title=GitHub Pages не включены::Откройте Settings → Pages → Source: GitHub Actions и сохраните (нужны права администратора репозитория), затем перезапустите этот workflow: Actions → Deploy to GitHub Pages → Run workflow."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          # Довключит Pages, если сайт уже создан, но источник не указан
          enablement: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # base считается из имени репозитория тем же скриптом, что и локально
      # (scripts/build-pages.cjs) — раньше workflow и package.json могли разойтись
      - name: Build (base = /<имя репозитория>/)
        run: npm run build:pages

      # Не публикуем сборку с битыми путями к фото, якорями или рассинхроном FAQ
      - name: Check build integrity
        run: node scripts/check.cjs

      # База знаний чат-бота проверяется отдельно: подбор ответа ломается тихо —
      # и tsc, и vite build остаются зелёными, а бот начинает отвечать невпопад
      # («сколько лет ребёнку?» → ответ про цену). Сборка для этого не нужна.
      - name: Check chatbot knowledge base
        run: node scripts/check-chat.cjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
