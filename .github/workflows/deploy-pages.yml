name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # Деплой не отменяем на середине: иначе Pages могут остаться без артефакта
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Автоматически включает GitHub Pages (источник — GitHub Actions),
          # если это ещё не сделано вручную в Settings → Pages.
          enablement: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # base считается из имени репозитория тем же скриптом, что и локально
      # (scripts/build-pages.cjs) — раньше workflow и package.json могли разойтись
      - name: Build (base = /<имя репозитория>/)
        run: npm run build:pages

      # Не публикуем сборку с битыми путями к фото, якорями или рассинхроном FAQ
      - name: Check build integrity
        run: node scripts/check.cjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
